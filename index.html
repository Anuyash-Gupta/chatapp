<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp</title>

  <!-- Clean geometric sans-serif + mono for the code display -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       CSS RESET + VARIABLES
    ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Palette: off-white background, dark ink, single green accent */
      --bg:         #f0ede8;
      --surface:    #ffffff;
      --border:     #d8d3cc;
      --ink:        #1c1917;
      --ink-mid:    #57534e;
      --ink-light:  #a8a29e;
      --accent:     #16a34a;      /* green */
      --accent-dk:  #15803d;
      --sent-bg:    #1c1917;      /* my messages: dark */
      --sent-tx:    #f5f0eb;
      --recv-bg:    #e7e2db;      /* their messages: warm grey */
      --recv-tx:    #1c1917;
      --danger:     #dc2626;
      --radius-sm:  6px;
      --radius-md:  12px;
      --radius-lg:  20px;
      --shadow:     0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      --font:       'IBM Plex Sans', sans-serif;
      --mono:       'IBM Plex Mono', monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }

    /* =========================================================
       SCREEN MANAGER
       Only one .screen is visible at a time
    ========================================================= */
    .screen { display: none; }
    .screen.active { display: flex; }

    /* =========================================================
       LOBBY SCREEN  (create / join)
    ========================================================= */
    #screen-lobby {
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    /* App title */
    .lobby-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .lobby-header h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .lobby-header h1 span { color: var(--accent); }
    .lobby-header p {
      margin-top: 4px;
      font-size: 13px;
      color: var(--ink-light);
    }

    /* Username row */
    .lobby-body { padding: 24px 32px 28px; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--ink-mid);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); background: #fff; }
    .field input::placeholder { color: var(--ink-light); }

    /* Code input — monospace, large, centred */
    .field input.code-field {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 6px;
      text-align: center;
      text-transform: uppercase;
    }

    /* Divider between Create / Join */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: var(--ink-light);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-align: center;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.88; }
    .btn:not(:disabled):active { transform: scale(0.98); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--ink-mid); }

    /* Error notice */
    .notice {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      display: none;
    }
    .notice.error   { background: #fef2f2; color: var(--danger); }
    .notice.success { background: #f0fdf4; color: var(--accent-dk); }
    .notice.show    { display: block; }

    /* =========================================================
       WAITING SCREEN  (show code, waiting for peer)
    ========================================================= */
    #screen-waiting {
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .waiting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 380px;
      padding: 36px 32px;
      text-align: center;
    }
    .waiting-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .waiting-card .sub { font-size: 13px; color: var(--ink-light); margin-bottom: 28px; }

    /* The big code display */
    .code-box {
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius-md);
      padding: 20px 24px 16px;
      margin-bottom: 20px;
    }
    .code-box .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a8a29e;
      margin-bottom: 8px;
    }
    .code-box .code {
      font-family: var(--mono);
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 8px;
    }

    /* Copy button */
    .btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: none;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      color: var(--ink-mid);
      transition: all 0.15s;
      margin-bottom: 24px;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { border-color: var(--accent); color: var(--accent); }

    /* Pulsing dots */
    .pulse-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%           { opacity: 1;    transform: scale(1);   }
    }

    .btn-back {
      background: none;
      border: none;
      font-family: var(--font);
      font-size: 13px;
      color: var(--ink-light);
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-back:hover { color: var(--ink); }

    /* =========================================================
       CHAT SCREEN
    ========================================================= */
    #screen-chat {
      height: 100vh;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .chat-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .chat-header .room-info { flex: 1; }
    .chat-header .room-name {
      font-size: 15px;
      font-weight: 600;
    }
    .chat-header .room-code-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-mid);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      letter-spacing: 2px;
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    /* Scrollbar */
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    /* Date separator */
    .day-label {
      text-align: center;
      font-size: 11px;
      color: var(--ink-light);
      padding: 8px 0;
    }

    /* Individual message bubble */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: slideIn 0.18s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* My messages go to the right */
    .msg-row.mine  { align-self: flex-end;  align-items: flex-end; }
    /* Their messages go to the left */
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }

    /* Sender name shown above first message in a group */
    .msg-sender {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-mid);
      margin-bottom: 3px;
      padding: 0 4px;
    }
    .msg-row.mine .msg-sender { color: var(--accent-dk); }

    /* The bubble itself */
    .bubble {
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;   /* preserve line breaks */
    }
    .msg-row.mine   .bubble { background: var(--sent-bg); color: var(--sent-tx); border-bottom-right-radius: 4px; }
    .msg-row.theirs .bubble { background: var(--recv-bg); color: var(--recv-tx); border-bottom-left-radius: 4px; }

    /* Consecutive bubbles from same person: tighten corners */
    .msg-row.mine   + .msg-row.mine   .bubble { border-top-right-radius: 4px; }
    .msg-row.theirs + .msg-row.theirs .bubble { border-top-left-radius: 4px; }

    /* Timestamp shown under each bubble */
    .msg-time {
      font-size: 10px;
      color: var(--ink-light);
      padding: 2px 4px 0;
    }

    /* System message (e.g. "joined the room") */
    .msg-system {
      align-self: center;
      font-size: 12px;
      color: var(--ink-light);
      background: var(--bg);
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink-light);
      font-size: 13px;
      padding-bottom: 40px;
    }
    .empty-state .icon { font-size: 32px; opacity: 0.4; }

    /* ── Typing indicator ── */
    .typing-bar {
      min-height: 24px;
      padding: 0 20px;
      font-size: 12px;
      color: var(--ink-light);
      font-style: italic;
    }

    /* ── Input bar ── */
    .input-bar {
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-family: var(--font);
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    #msg-input:focus { border-color: var(--accent); background: #fff; }
    #msg-input::placeholder { color: var(--ink-light); }

    #send-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover:not(:disabled)  { background: var(--accent-dk); }
    #send-btn:active:not(:disabled) { transform: scale(0.93); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    #send-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }

    /* =========================================================
       RESPONSIVE
    ========================================================= */
    @media (max-width: 480px) {
      .lobby-body   { padding: 20px; }
      .lobby-header { padding: 24px 20px 18px; }
      .code-box .code { font-size: 28px; }
      .msg-row { max-width: 90%; }
    }
  </style>
</head>
<body>

  <!-- =====================================================
       SCREEN 1 — LOBBY  (create or join a room)
  ===================================================== -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-card">

      <div class="lobby-header">
        <h1>Chat<span>App</span></h1>
        <p>Simple private chat · no account needed</p>
      </div>

      <div class="lobby-body">

        <!-- Username (shared by both create + join) -->
        <div class="field">
          <label>Your name</label>
          <input type="text" id="username-input" placeholder="e.g. Alice" maxlength="32" autocomplete="off" />
        </div>

        <!-- CREATE a new room -->
        <button class="btn btn-primary" id="create-btn" onclick="handleCreate()">
          Create a new room
        </button>
        <div class="notice error" id="create-error"></div>

        <div class="divider">or join an existing one</div>

        <!-- JOIN an existing room -->
        <div class="field">
          <label>Room code</label>
          <input type="text" id="join-code-input" class="code-field"
                 placeholder="ABC123" maxlength="6" autocomplete="off"
                 oninput="this.value = this.value.toUpperCase()" />
        </div>

        <button class="btn btn-secondary" id="join-btn" onclick="handleJoin()">
          Join room
        </button>
        <div class="notice error" id="join-error"></div>

      </div>
    </div>
  </div>


  <!-- =====================================================
       SCREEN 2 — WAITING  (room created, share the code)
  ===================================================== -->
  <div id="screen-waiting" class="screen">
    <div class="waiting-card">
      <h2>Room created!</h2>
      <p class="sub">Share this code with the person you want to chat with.</p>

      <div class="code-box">
        <div class="label">Your room code</div>
        <div class="code" id="display-code">——————</div>
      </div>

      <button class="btn-copy" id="copy-btn" onclick="copyCode()">
        <!-- clipboard icon -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
        </svg>
        Copy code
      </button>

      <p style="font-size:13px;color:var(--ink-light);margin-bottom:16px;">
        Waiting for someone to join…
      </p>
      <div class="pulse-row">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <button class="btn-back" onclick="goBackToLobby()">← Back</button>
    </div>
  </div>


  <!-- =====================================================
       SCREEN 3 — CHAT
  ===================================================== -->
  <div id="screen-chat" class="screen">

    <!-- Header bar -->
    <div class="chat-header">
      <div class="room-info">
        <div class="room-name" id="chat-peer-name">Chat</div>
      </div>
      <span class="room-code-pill" id="chat-room-code-display"></span>
    </div>

    <!-- Messages list -->
    <div class="messages" id="messages-box">
      <div class="empty-state" id="empty-state">
        <div class="icon">💬</div>
        <span>No messages yet — say hello!</span>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-bar" id="typing-bar"></div>

    <!-- Input -->
    <div class="input-bar">
      <textarea id="msg-input"
                placeholder="Type a message… (Enter to send)"
                rows="1"
                oninput="onInputChange()"
                onkeydown="onInputKeydown(event)"></textarea>

      <button id="send-btn" onclick="sendMessage()" disabled>
        <!-- send / paper-plane icon -->
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->
  <script>
    // -------------------------------------------------------
    // App state — everything we need to remember
    // -------------------------------------------------------
    const app = {
      username:      '',    // chosen by user on lobby screen
      roomCode:      '',    // 6-char room code
      lastMessageId: 0,     // highest message ID we've seen (for efficient polling)
      pollTimer:     null,  // reference to setInterval so we can clear it
      waitTimer:     null,  // interval on the waiting screen
    };

    // -------------------------------------------------------
    // Utility: show / hide screens
    // -------------------------------------------------------
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // -------------------------------------------------------
    // Utility: show an error message under a button
    // -------------------------------------------------------
    function showError(elId, text) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.classList.add('show');
    }
    function hideError(elId) {
      document.getElementById(elId).classList.remove('show');
    }

    // -------------------------------------------------------
    // Utility: generic POST helper (returns parsed JSON)
    // -------------------------------------------------------
    async function apiPost(url, data) {
      const res = await fetch(url, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(data),
      });
      return res.json();
    }

    // -------------------------------------------------------
    // LOBBY: Create a new room
    // -------------------------------------------------------
    async function handleCreate() {
      hideError('create-error');

      const username = document.getElementById('username-input').value.trim();
      if (!username) {
        showError('create-error', 'Please enter your name first.');
        return;
      }

      const btn = document.getElementById('create-btn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      try {
        const data = await apiPost('create_room.php', {});

        if (!data.ok) {
          showError('create-error', data.error || 'Failed to create room.');
          return;
        }

        // Save to app state
        app.username = username;
        app.roomCode = data.room_code;

        // Go straight into the chat room — creator can start chatting right away.
        // Store the code so it shows in the header.
        enterChat();

      } catch (err) {
        showError('create-error', 'Network error — is the PHP server running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create a new room';
      }
    }

    // -------------------------------------------------------
    // LOBBY: Join an existing room
    // -------------------------------------------------------
    async function handleJoin() {
      hideError('join-error');

      const username = document.getElementById('username-input').value.trim();
      const code     = document.getElementById('join-code-input').value.trim().toUpperCase();

      if (!username) { showError('join-error', 'Please enter your name first.'); return; }
      if (code.length !== 6) { showError('join-error', 'Room code must be exactly 6 characters.'); return; }

      const btn = document.getElementById('join-btn');
      btn.disabled = true;
      btn.textContent = 'Joining…';

      try {
        const data = await apiPost('join_room.php', { room_code: code });

        if (!data.ok) {
          showError('join-error', data.error || 'Could not join room.');
          return;
        }

        // Valid room — save state and enter chat
        app.username = username;
        app.roomCode = code;
        enterChat();

      } catch (err) {
        showError('join-error', 'Network error — is the PHP server running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Join room';
      }
    }

    // -------------------------------------------------------
    // WAITING SCREEN: copy the code to clipboard
    // -------------------------------------------------------
    function copyCode() {
      navigator.clipboard.writeText(app.roomCode).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✓ Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy code';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // -------------------------------------------------------
    // WAITING SCREEN: go back to lobby
    // -------------------------------------------------------
    function goBackToLobby() {
      clearInterval(app.pollTimer);
      clearInterval(app.waitTimer);
      showScreen('screen-lobby');
    }

    // -------------------------------------------------------
    // ENTER CHAT — called after create or join succeeds
    // -------------------------------------------------------
    function enterChat() {
      // Update header
      document.getElementById('chat-peer-name').textContent  = `Hello, ${app.username}`;
      document.getElementById('chat-room-code-display').textContent = app.roomCode;

      // Reset message state
      app.lastMessageId = 0;
      document.getElementById('messages-box').innerHTML =
        '<div class="empty-state" id="empty-state"><div class="icon">💬</div><span>No messages yet — say hello!</span></div>';

      showScreen('screen-chat');

      // Start polling for new messages every 1.5 seconds
      clearInterval(app.pollTimer);
      app.pollTimer = setInterval(pollMessages, 1500);

      // Also poll immediately so we don't wait 1.5s on first load
      pollMessages();
    }

    // -------------------------------------------------------
    // POLLING: fetch new messages from the server
    // -------------------------------------------------------
    async function pollMessages() {
      if (!app.roomCode) return;

      try {
        const url = `fetch_messages.php?room_code=${encodeURIComponent(app.roomCode)}&after_id=${app.lastMessageId}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (!data.ok || !data.messages) return;

        // Append each new message to the chat
        data.messages.forEach(msg => {
          appendMessage(msg);
          // Track the highest ID we've seen
          if (parseInt(msg.id) > app.lastMessageId) {
            app.lastMessageId = parseInt(msg.id);
          }
        });

      } catch (err) {
        // Silently ignore network hiccups during polling
        console.warn('Poll error:', err);
      }
    }

    // -------------------------------------------------------
    // RENDER: add one message bubble to the chat
    // -------------------------------------------------------
    function appendMessage(msg) {
      const box   = document.getElementById('messages-box');
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();   // hide "no messages" placeholder

      const isMine = (msg.username === app.username);

      // Wrapper row
      const row = document.createElement('div');
      row.className = 'msg-row ' + (isMine ? 'mine' : 'theirs');

      // Sender name
      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = msg.username;

      // Bubble
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.message;  // textContent prevents XSS

      // Timestamp
      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime(msg.sent_at);

      row.appendChild(sender);
      row.appendChild(bubble);
      row.appendChild(time);
      box.appendChild(row);

      // Scroll to the newest message
      box.scrollTop = box.scrollHeight;
    }

    // -------------------------------------------------------
    // SEND MESSAGE
    // -------------------------------------------------------
    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text  = input.value.trim();
      if (!text) return;

      // Clear input immediately for responsive feel
      input.value = '';
      input.style.height = 'auto';   // reset auto-grow
      document.getElementById('send-btn').disabled = true;

      try {
        const data = await apiPost('send_message.php', {
          room_code: app.roomCode,
          username:  app.username,
          message:   text,
        });

        if (!data.ok) {
          // Put the text back so user doesn't lose it
          input.value = text;
          console.error('Send failed:', data.error);
        }
        // The message will appear via the next poll cycle (1.5s max delay)
        // This ensures both users see it from the same source of truth.

      } catch (err) {
        input.value = text;   // restore on error
        console.error('Send error:', err);
      }
    }

    // -------------------------------------------------------
    // INPUT: auto-grow textarea + enable/disable send button
    // -------------------------------------------------------
    function onInputChange() {
      const input   = document.getElementById('msg-input');
      const sendBtn = document.getElementById('send-btn');

      // Auto-grow height
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';

      // Enable send only when there's content
      sendBtn.disabled = !input.value.trim();
    }

    // -------------------------------------------------------
    // INPUT: Enter key sends, Shift+Enter adds newline
    // -------------------------------------------------------
    function onInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // -------------------------------------------------------
    // UTILITY: Format a MySQL datetime string into HH:MM
    // -------------------------------------------------------
    function formatTime(datetimeStr) {
      if (!datetimeStr) return '';
      const d = new Date(datetimeStr.replace(' ', 'T')); // make it ISO for Safari
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
